<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Candle</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
            overflow: hidden;
            font-family: sans-serif;
        }

        #candleContainer {
            position: relative;
            width: 300px;
            height: 400px;
        }

        #candle {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 220px;
            height: auto;
        }

        #flame {
            position: absolute;
            left: 51%;
            bottom: 201px;
            transform: translateX(-45%);
            width: 30px;
            height: auto;

            transform-origin: 50% 100%;
            animation: flame 0.12s infinite alternate ease-in-out;
        }

        /*
         * Smoke is initially invisible.
         */
        #smoke {
            position: absolute;
            left: 50%;
            bottom: 255px;
            transform: translateX(-50%);
            width: 45px;
            height: auto;

            opacity: 0;
            pointer-events: none;
        }

        /*
         * Flame distortion/burning animation.
         */
        @keyframes flame {
            0% {
                transform:
                    translateX(-50%)
                    rotate(-3deg)
                    scaleX(0.95)
                    scaleY(1.02);
            }

            25% {
                transform:
                    translateX(-50%)
                    rotate(2deg)
                    scaleX(1.04)
                    scaleY(0.97);
            }

            50% {
                transform:
                    translateX(-50%)
                    rotate(-2deg)
                    scaleX(0.97)
                    scaleY(1.06);
            }

            75% {
                transform:
                    translateX(-50%)
                    rotate(4deg)
                    scaleX(1.03)
                    scaleY(0.98);
            }

            100% {
                transform:
                    translateX(-50%)
                    rotate(-4deg)
                    scaleX(0.94)
                    scaleY(1.03);
            }
        }

        /*
         * Smoke animation.
         */
        @keyframes smoke {
            0% {
                opacity: 0;
                transform:
                    translateX(-50%)
                    translateY(0)
                    scale(0.5);
            }

            20% {
                opacity: 0.8;
            }

            100% {
                opacity: 0;
                transform:
                    translateX(-50%)
                    translateY(-130px)
                    scale(1.8);
            }
        }

        #message {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 18px;
            color: #555;
        }

        #startButton {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);

            padding: 12px 24px;
            border: none;
            border-radius: 8px;

            background: #333;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        #startButton:hover {
            background: #555;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

    <script>
        const candle = document.getElementById("candle");
        const flame = document.getElementById("flame");
        const smoke = document.getElementById("smoke");
        const startButton = document.getElementById("startButton");
        const message = document.getElementById("message");

        let audioContext;
        let analyser;
        let microphone;
        let animationFrame;

        let candleBlownOut = false;

        /*
         * Start microphone
         */
        async function startMicrophone() {

            try {

                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: true
                });

                audioContext = new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

                analyser = audioContext.createAnalyser();

                /*
                 * Smaller FFT size gives us a simple,
                 * responsive measurement of the sound level.
                 */
                analyser.fftSize = 512;

                microphone =
                    audioContext.createMediaStreamSource(stream);

                microphone.connect(analyser);

                startButton.classList.add("hidden");

                message.textContent =
                    "";

                detectBlow();

            } catch (error) {

                console.error(
                    "Could not access microphone:",
                    error
                );

                message.textContent =
                    "Please allow microphone access.";
            }
        }


        /*
         * Calculate the current microphone volume.
         */
        function getVolume() {

            const data =
                new Uint8Array(analyser.fftSize);

            analyser.getByteTimeDomainData(data);

            let sum = 0;

            for (let i = 0; i < data.length; i++) {

                /*
                 * Audio data is centred around 128.
                 */
                const value =
                    (data[i] - 128) / 128;

                sum += value * value;
            }

            return Math.sqrt(sum / data.length);
        }

/*
 * ---------------------------------------------------------
 * BLOW DETECTION
 * ---------------------------------------------------------
 *
 * The algorithm maintains a rolling 1-second history of
 * microphone volume.
 *
 * A blow is detected when:
 *
 *     current volume > ambient average × BLOW_RATIO
 *
 * and this condition remains true for at least 200 ms.
 *
 * This makes the detector respond to a sudden increase
 * rather than simply responding to loud sounds.
 */


/*
 * Configuration
 */
const AVERAGE_PERIOD = 1000;   // 1 second
const BLOW_DURATION = 200;     // 200 milliseconds

/*
 * How much louder than the ambient average the sound
 * must become before we consider it a possible blow.
 *
 * 2.0 means:
 *
 *     current volume > 2 × average volume
 *
 * Increase this to make blow detection harder.
 */
const BLOW_RATIO = 2.0;


/*
 * Volume samples.
 *
 * Each entry has:
 *
 * {
 *     volume: Number,
 *     time: Number
 * }
 */
let volumeHistory = [];


/*
 * Time at which the current possible blow started.
 *
 * null means that we are not currently detecting
 * a possible blow.
 */
let possibleBlowStart = null;


/*
 * Calculate the current microphone volume.
 */
function getVolume() {

    const data =
        new Uint8Array(analyser.fftSize);

    analyser.getByteTimeDomainData(data);

    let sum = 0;

    for (let i = 0; i < data.length; i++) {

        /*
         * Convert the microphone sample from
         * 0...255 to approximately -1...+1.
         */
        const value =
            (data[i] - 128) / 128;

        sum += value * value;
    }

    /*
     * RMS volume.
     */
    return Math.sqrt(sum / data.length);
}


/*
 * Add a volume measurement to the rolling history.
 */
function addVolumeSample(volume) {

    const now = performance.now();

    volumeHistory.push({
        volume: volume,
        time: now
    });

    /*
     * Remove samples older than 1 second.
     */
    const oldestAllowed =
        now - AVERAGE_PERIOD;

    while (
        volumeHistory.length > 0 &&
        volumeHistory[0].time < oldestAllowed
    ) {
        volumeHistory.shift();
    }
}


/*
 * Calculate the average volume over the previous
 * one second.
 *
 * IMPORTANT:
 *
 * We exclude the most recent sample from the
 * ambient average. This prevents the loud blow
 * itself from immediately raising the baseline.
 */
function getAmbientAverage() {

    if (volumeHistory.length < 2) {
        return 0;
    }

    const newestTime =
        volumeHistory[volumeHistory.length - 1].time;

    let sum = 0;
    let count = 0;

    for (let i = 0; i < volumeHistory.length; i++) {

        /*
         * Exclude the newest sample.
         */
        if (
            volumeHistory[i].time <
            newestTime
        ) {

            sum += volumeHistory[i].volume;
            count++;
        }
    }

    if (count === 0) {
        return 0;
    }

    return sum / count;
}

/*
 * Detect a sudden increase in volume.
 */
function detectBlow() {

    if (candleBlownOut) {
        return;
    }

    const now = performance.now();

    /*
     * Measure the current volume.
     */
    const currentVolume = getVolume();

    /*
     * Add it to our rolling 1-second history.
     */
    addVolumeSample(currentVolume);

    /*
     * Calculate the ambient volume.
     */
    const ambientAverage =
        getAmbientAverage();


    /*
     * Don't attempt detection until we have
     * approximately 1 second of background data.
     */
    if (volumeHistory.length > 5) {

        /*
         * Determine whether the current sound is
         * significantly louder than the ambient level.
         */
        const suddenIncrease =
            currentVolume >
            ambientAverage * BLOW_RATIO;


        if (suddenIncrease) {

            /*
             * A possible blow has started.
             */
            if (possibleBlowStart === null) {

                possibleBlowStart = now;
            }


            /*
             * Has the increase lasted for at least
             * 200 milliseconds?
             */
            const duration =
                now - possibleBlowStart;


            if (duration >= BLOW_DURATION) {

                blowOutCandle();

                return;
            }

        } else {

            /*
             * The sound dropped back toward ambient
             * levels, so cancel the possible blow.
             */
            possibleBlowStart = null;
        }
    }


    /*
     * Continue monitoring.
     */
    animationFrame =
        requestAnimationFrame(detectBlow);
}
